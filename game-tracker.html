<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#007AFF">
  <title>Game Tracker - Soccer Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="src/css/styles.css">
  <style>
    body {
      background: var(--background-light);
    }

    .tracker-root {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100dvh;
      background: var(--background-white);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      margin: 0 auto;
    }

    .game-banner {
      position: relative;
      overflow: hidden;
      padding: calc(10px + env(safe-area-inset-top)) 0 14px;
      background:
        linear-gradient(rgba(0, 0, 0, 0.22), rgba(0, 0, 0, 0.38)),
        repeating-linear-gradient(115deg, #3d8f45 0px, #3d8f45 3px, #2f7a37 3px, #2f7a37 6px),
        #337a3c;
      flex-shrink: 0;
    }

    .banner-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .banner-glow.away {
      background: radial-gradient(circle at top left, var(--away-color, transparent) 0%, transparent 65%);
    }

    .banner-glow.home {
      background: radial-gradient(circle at top right, var(--home-color, transparent) 0%, transparent 65%);
    }

    .banner-content {
      position: relative;
      z-index: 1;
    }

    .banner-pill-row {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
      padding: 0 52px;
    }

    .banner-pill {
      background: rgba(0, 0, 0, 0.5);
      color: white;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 999px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .banner-grid {
      display: grid;
      grid-template-columns: 40px 1fr auto 1fr 40px;
      align-items: center;
      column-gap: 6px;
      padding: 0 12px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .banner-circle-btn {
      grid-row: 1 / 3;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      touch-action: manipulation;
    }

    .banner-circle-btn:active {
      background: rgba(255, 255, 255, 0.4);
    }

    .banner-back { grid-column: 1; }
    .banner-overflow { grid-column: 5; }

    .team-abbr {
      grid-row: 1;
      justify-self: center;
      color: white;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    .team-abbr.away { grid-column: 2; }
    .team-abbr.home { grid-column: 4; }

    .team-score {
      grid-row: 2;
      justify-self: center;
      color: white;
      font-size: 36px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      background: none;
      border: none;
      padding: 2px 10px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .team-score.away { grid-column: 2; }
    .team-score.home { grid-column: 4; }

    .banner-clock-small {
      grid-column: 3;
      grid-row: 1;
      color: white;
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .banner-center {
      grid-column: 3;
      grid-row: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .banner-clock-btn {
      background: none;
      border: none;
      padding: 0;
      color: white;
      font-size: 34px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      touch-action: manipulation;
    }

    .banner-icon-btn {
      background: none;
      border: none;
      padding: 4px;
      cursor: pointer;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .list-header {
      height: 40px;
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      padding: 0 var(--spacing-lg);
      background: #f9f9f9;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .header-cell {
      font-size: var(--font-size-xs);
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .player-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .section-label {
      padding: 6px 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      background: #f9f9f9;
      text-transform: uppercase;
      position: sticky;
      top: 0;
    }

    .empty-row {
      padding: 16px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .pos-badge {
      width: 36px;
      height: 28px;
      border-radius: 14px;
      border: none;
      font-size: 11px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      flex-shrink: 0;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .pos-badge.pos-forward { background: #FF9500; }
    .pos-badge.pos-midfield { background: #34C759; }
    .pos-badge.pos-defense { background: #007AFF; }
    .pos-badge.pos-goalie { background: #AF52DE; }
    .pos-badge.pos-none { background: #8e8e93; }

    .pos-badge-inert {
      cursor: default;
    }

    .player-name-cell {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 15px;
    }

    .time-cell {
      width: 48px;
      text-align: right;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .time-cell.dim {
      color: var(--text-secondary);
    }

    .action-cell {
      width: 56px;
      text-align: center;
      flex-shrink: 0;
    }

    .action-btn {
      height: 32px;
      min-width: 48px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }

    .action-btn.play {
      background: var(--primary-color);
      color: white;
    }

    .action-btn.sit {
      background: #FFEBEA;
      color: #FF3B30;
    }

    .action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .footer {
      height: calc(60px + env(safe-area-inset-bottom));
      padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
      background: var(--background-white);
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .footer-btn {
      flex: 1;
      height: 44px;
      border-radius: var(--radius-md);
      border: 1px solid var(--primary-color);
      background: white;
      color: var(--primary-color);
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
    }

    .footer-btn:active {
      background: var(--background-light);
    }

    .staged-card {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .staged-label {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .footer-btn-secondary {
      flex: 0 0 auto;
      padding: 0 16px;
      background: var(--background-light);
      color: var(--primary-color);
      border-color: transparent;
    }

    .footer-btn-secondary:active {
      background: var(--border-color);
    }

    .modal input[type="text"] {
      margin-bottom: 12px;
    }

    .position-choice-btn {
      background: var(--background-light);
      color: var(--text-primary);
    }

    .position-choice-btn:active {
      background: var(--border-color);
    }

    .modal-staging {
      max-width: 374px;
      width: calc(100% - 16px);
    }

    .staging-list {
      max-height: 68vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      margin-bottom: 16px;
    }

    .staging-section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 6px 12px;
      background: #f9f9f9;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
    }

    .staging-section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .staging-section-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .staging-section-count.exact {
      color: #34C759;
    }

    .staging-row {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      padding: 8px var(--spacing-md);
      border-bottom: 1px solid var(--border-light);
    }

    .staging-row:last-child {
      border-bottom: none;
    }

    .staging-row.staged {
      background: #EAF2FF;
    }

    .staging-name {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 14px;
      color: var(--text-primary);
    }

    .modal select,
    .modal input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-family: var(--font-family);
      margin-bottom: 12px;
      background: white;
    }

    .goal-meta {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      margin: -6px 0 14px;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .color-swatch {
      width: 100%;
      aspect-ratio: 1;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .color-swatch-dot {
      width: 60%;
      height: 60%;
      border-radius: 50%;
      border: 3px solid transparent;
    }

    .color-swatch.selected .color-swatch-dot {
      border-color: var(--text-primary);
      box-shadow: 0 0 0 2px var(--background-white) inset;
    }

    .modal-details {
      max-width: 340px;
      width: calc(100% - 24px);
      max-height: 85vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .details-section-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 16px 0 8px;
    }

    .details-roster-list {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      max-height: 220px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 16px;
    }

    .details-roster-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-light);
    }

    .details-roster-row:last-child {
      border-bottom: none;
    }

    .details-row {
      display: flex;
      gap: 8px;
    }

    .details-row .abbr-input {
      flex: 0 0 80px;
      text-transform: uppercase;
    }

    .details-row .name-input {
      flex: 1;
      min-width: 0;
    }

    .modal-btn.danger-outline {
      width: 100%;
      margin-top: 12px;
      background: none;
      color: #FF3B30;
    }

    .modal-btn.danger-outline:active {
      background: var(--background-light);
    }

    .modal-btn.danger {
      background: #FF3B30;
      color: white;
    }

    .modal-btn.danger:active {
      background: #D9342B;
    }

    .modal-buttons-row {
      display: flex;
      gap: var(--spacing-sm);
    }

    .modal-buttons-row .modal-btn {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="tracker-root">
    <div class="game-banner" id="gameBanner">
      <div class="banner-glow away"></div>
      <div class="banner-glow home"></div>
      <div class="banner-content">
        <div class="banner-pill-row">
          <div class="banner-pill" id="gamePill">Opponent</div>
        </div>
        <div class="banner-grid">
          <button class="banner-circle-btn banner-back" id="backBtn" title="Back">
            <svg width="14" height="22" viewBox="0 0 14 22" fill="none"><polyline points="12,2 2,11 12,20" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </button>
          <div class="team-abbr away" id="awayAbbr">IMM</div>
          <div class="banner-clock-small" id="clockSmall" style="display:none;">0:00</div>
          <div class="team-abbr home" id="homeAbbr">OPP</div>
          <button class="banner-circle-btn banner-overflow" id="overflowBtn" title="Menu">
            <svg width="20" height="14" viewBox="0 0 20 14" fill="none"><line x1="0" y1="1" x2="20" y2="1" stroke="white" stroke-width="2" stroke-linecap="round"/><line x1="0" y1="7" x2="20" y2="7" stroke="white" stroke-width="2" stroke-linecap="round"/><line x1="0" y1="13" x2="20" y2="13" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button class="team-score away" id="awayScore" title="Record a goal">0</button>
          <div class="banner-center" id="bannerCenter"><!-- state-dependent play/clock/stop controls --></div>
          <button class="team-score home" id="homeScore" title="Record a goal">0</button>
        </div>
      </div>
    </div>

    <div class="list-header">
      <div class="header-cell" style="width: 36px;">Pos</div>
      <div class="header-cell" style="flex: 1;">Name</div>
      <div class="header-cell" style="width: 48px; text-align: right;">Total</div>
      <div class="header-cell" style="width: 48px; text-align: right;">Stint</div>
      <div class="header-cell" style="width: 56px; text-align: center;">Action</div>
    </div>

    <div class="player-list" id="playerList">
      <!-- Players will be rendered here -->
    </div>

    <div class="footer" id="footer">
      <button class="footer-btn" id="stageBtn">Stage</button>
    </div>
  </div>

  <!-- Position picker (long-press on a position badge, main list or staging list) -->
  <div class="modal-overlay hidden" id="positionMenuOverlay">
    <div class="modal">
      <h3 class="modal-title">Change Position</h3>
      <div class="modal-buttons" id="positionMenuButtons">
        <button class="modal-btn position-choice-btn" data-position="Forward">Forward</button>
        <button class="modal-btn position-choice-btn" data-position="Midfield">Midfield</button>
        <button class="modal-btn position-choice-btn" data-position="Defense">Defense</button>
        <button class="modal-btn position-choice-btn" data-position="Goalie">Goalie</button>
        <button class="modal-btn position-choice-btn" data-position="None">—</button>
        <button class="modal-btn cancel" id="positionMenuCancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Staging (bulk substitution) -->
  <div class="modal-overlay hidden" id="stagingOverlay">
    <div class="modal modal-staging">
      <h3 class="modal-title">Stage Substitutions</h3>
      <div class="staging-list" id="stagingList"><!-- sections + rows rendered here --></div>
      <div class="modal-buttons" id="stagingModalButtons"><!-- Cancel always here; Done only appears at the exact field count --></div>
    </div>
  </div>

  <!-- Goal (tap a team's score) -->
  <div class="modal-overlay hidden" id="goalOverlay">
    <div class="modal">
      <h3 class="modal-title" id="goalModalTitle">Goal</h3>
      <div class="goal-meta" id="goalModalMeta">1st Half · 0:00</div>
      <select id="goalScorerSelect" style="display:none;"></select>
      <input type="text" id="goalScorerInput" placeholder="Scorer (optional)" style="display:none;">
      <div class="modal-buttons">
        <button class="modal-btn confirm" id="confirmGoalBtn">Goal!</button>
        <button class="modal-btn cancel" id="cancelGoalBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- End Half / End Game confirmation -->
  <div class="modal-overlay hidden" id="endHalfConfirmOverlay">
    <div class="modal">
      <h3 class="modal-title" id="endHalfConfirmTitle">End the 1st half?</h3>
      <div class="modal-buttons">
        <button class="modal-btn confirm" id="confirmEndHalfBtn">End Half</button>
        <button class="modal-btn cancel" id="cancelEndHalfBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Game Details (from overflow menu) -->
  <div class="modal-overlay hidden" id="gameDetailsOverlay">
    <div class="modal modal-details">
      <h3 class="modal-title">Settings</h3>

      <div class="details-row">
        <input type="text" class="abbr-input" id="detailsAbbr" placeholder="Abbr." maxlength="4">
        <input type="text" class="name-input" id="detailsOpponent" placeholder="Opponent">
      </div>

      <div class="color-grid" id="detailsColorGrid"></div>

      <input type="text" id="detailsDateTime" placeholder="Date & time">
      <input type="text" id="detailsLocation" placeholder="Location">

      <div class="details-section-label">Roster</div>
      <div class="details-roster-list" id="detailsRosterList"><!-- checkboxes rendered here --></div>

      <div class="modal-buttons">
        <button class="modal-btn confirm" id="confirmGameDetailsBtn">Save</button>
        <button class="modal-btn cancel" id="cancelGameDetailsBtn">Cancel</button>
      </div>

      <button class="modal-btn danger-outline" id="deleteGameBtn">Delete Game</button>
    </div>
  </div>

  <!-- Delete Game confirmation -->
  <div class="modal-overlay hidden" id="deleteGameConfirmOverlay">
    <div class="modal">
      <p class="modal-message">Are you sure you want to delete this game? The action cannot be undone.</p>
      <div class="modal-buttons-row">
        <button class="modal-btn danger" id="confirmDeleteGameBtn">Delete Game</button>
        <button class="modal-btn cancel" id="cancelDeleteGameBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="src/js/storage.js"></script>
  <script src="src/js/app.js"></script>
  <script>
    const POS_ABBR = { Forward: 'FWD', Midfield: 'MID', Defense: 'DEF', Goalie: 'GK', None: '—' };
    const POS_CLASS = { Forward: 'pos-forward', Midfield: 'pos-midfield', Defense: 'pos-defense', Goalie: 'pos-goalie', None: 'pos-none' };

    let positionMenuPlayerId = null;
    let positionMenuContext = 'main'; // 'main' or 'staging' — which list opened the picker

    function goHome() {
      // Game state autosaves on every change, so leaving is always safe —
      // the game resumes right where it left off next time it's opened.
      location.href = 'index.html';
    }

    function playIconSvg(size) {
      return `<svg width="${size}" height="${size}" viewBox="0 0 26 26"><polygon points="6,3 23,13 6,23" fill="white"/></svg>`;
    }

    function stopIconSvg(size) {
      return `<svg width="${size}" height="${size}" viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="16" rx="2" fill="white"/></svg>`;
    }

    function formatTime(totalSeconds) {
      const s = Math.max(0, Math.floor(totalSeconds));
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${m}:${String(sec).padStart(2, '0')}`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function openModal(id) {
      document.getElementById(id).classList.remove('hidden');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function renderBanner() {
      const game = App.currentGame;
      const teams = App.getTeams();
      const awayIsImm = game.immSide === 'away';
      const awayScore = awayIsImm ? game.score.imm : game.score.opponent;
      const homeScore = awayIsImm ? game.score.opponent : game.score.imm;

      document.getElementById('gamePill').textContent = game.opponent || 'Opponent';
      document.getElementById('awayAbbr').textContent = teams.away.abbr;
      document.getElementById('homeAbbr').textContent = teams.home.abbr;
      document.getElementById('awayScore').textContent = awayScore;
      document.getElementById('homeScore').textContent = homeScore;

      const banner = document.getElementById('gameBanner');
      banner.style.setProperty('--away-color', teams.away.color);
      banner.style.setProperty('--home-color', teams.home.color);

      const clock = game.clock;
      const elapsed = App.getClockElapsedSeconds();
      const clockSmall = document.getElementById('clockSmall');
      const center = document.getElementById('bannerCenter');

      if (!clock.hasStarted) {
        clockSmall.style.display = 'none';
        center.innerHTML = `<button class="banner-icon-btn" id="playBtn" title="Start clock">${playIconSvg(30)}</button>`;
      } else if (!clock.isPaused) {
        clockSmall.style.display = 'none';
        center.innerHTML = `<button class="banner-clock-btn" id="clockBigBtn" title="Pause">${formatTime(elapsed)}</button>`;
      } else {
        clockSmall.style.display = '';
        clockSmall.textContent = formatTime(elapsed);
        const endTitle = clock.currentHalf === 1 ? 'End 1st Half' : 'End Game';
        center.innerHTML = `
          <button class="banner-icon-btn" id="resumeBtn" title="Resume">${playIconSvg(24)}</button>
          <button class="banner-icon-btn" id="endHalfBtn" title="${endTitle}">${stopIconSvg(20)}</button>
        `;
      }
    }

    function renderPlayerRow(player, elapsedNow, fieldFull) {
      const isField = player.status === 'field';
      const stintSeconds = isField ? elapsedNow - player.stintStartSeconds : App.getBenchStintSeconds(player);
      const totalSeconds = (player.totalSeconds || 0) + (isField ? stintSeconds : 0);

      return `
        <div class="player-row ${isField ? 'playing' : 'bench'}">
          <button class="pos-badge ${POS_CLASS[player.position]} ${isField ? '' : 'pos-badge-inert'}" data-player-id="${player.id}">${POS_ABBR[player.position]}</button>
          <div class="player-name-cell">${escapeHtml(player.name)}</div>
          <div class="time-cell">${formatTime(totalSeconds)}</div>
          <div class="time-cell dim">${formatTime(stintSeconds)}</div>
          <div class="action-cell">
            <button
              class="action-btn ${isField ? 'sit' : 'play'}"
              data-player-id="${player.id}"
              data-action="${isField ? 'sit' : 'play'}"
              ${!isField && fieldFull ? 'disabled title="Bench a player first"' : ''}
            >${isField ? 'Sit' : 'Play'}</button>
          </div>
        </div>
      `;
    }

    function benchStintSortKey(player) {
      return Math.floor(App.getBenchStintSeconds(player));
    }

    function renderRoster() {
      const game = App.currentGame;
      const elapsedNow = App.getClockElapsedSeconds();
      const byName = (a, b) => a.name.localeCompare(b.name);

      const field = game.players.filter(p => p.status === 'field').sort(byName);
      // Longest off the field first; ties broken alphabetically
      const bench = game.players.filter(p => p.status === 'bench').sort((a, b) => {
        const diff = benchStintSortKey(b) - benchStintSortKey(a);
        return diff !== 0 ? diff : a.name.localeCompare(b.name);
      });
      const fieldFull = field.length >= game.playersOnField;

      let html = `<div class="section-label">On Field (${field.length}/${game.playersOnField})</div>`;
      html += field.length
        ? field.map(p => renderPlayerRow(p, elapsedNow, fieldFull)).join('')
        : '<div class="empty-row">No players on the field</div>';

      html += `<div class="section-label">Bench (${bench.length})</div>`;
      html += bench.length
        ? bench.map(p => renderPlayerRow(p, elapsedNow, fieldFull)).join('')
        : '<div class="empty-row">No players on the bench</div>';

      document.getElementById('playerList').innerHTML = html;
    }

    function renderFooter() {
      const footer = document.getElementById('footer');
      const staged = App.currentGame.stagedChanges;

      if (staged.length === 0) {
        footer.innerHTML = `<button class="footer-btn" id="stageBtn">Stage</button>`;
      } else {
        footer.innerHTML = `
          <div class="staged-card">
            <span class="staged-label">${staged.length} player${staged.length === 1 ? '' : 's'} staged</span>
            <button class="footer-btn footer-btn-secondary" id="cancelStagedBtn">Cancel</button>
            <button class="footer-btn" id="executeStagedBtn">Execute</button>
          </div>
        `;
      }
    }

    function render() {
      renderBanner();
      renderRoster();
      renderFooter();
    }

    function renderStagingRow(player, entry) {
      const effectiveField = entry ? entry.action === 'in' : player.status === 'field';
      // Bench players (effectively) don't have a position, regardless of what's staged
      const effectivePosition = effectiveField
        ? ((entry && entry.action === 'in') ? entry.position : player.position)
        : 'None';

      return `
        <div class="staging-row ${entry ? 'staged' : ''}">
          <button class="pos-badge ${POS_CLASS[effectivePosition]} ${effectiveField ? '' : 'pos-badge-inert'}" data-player-id="${player.id}">${POS_ABBR[effectivePosition]}</button>
          <div class="staging-name">${escapeHtml(player.name)}</div>
          <button class="action-btn ${effectiveField ? 'sit' : 'play'}" data-player-id="${player.id}">${effectiveField ? 'Sit' : 'Play'}</button>
        </div>
      `;
    }

    function stagingEffectiveField(game, player) {
      const entry = game.stagedChanges.find(c => c.playerId === player.id);
      return entry ? entry.action === 'in' : player.status === 'field';
    }

    function renderStagingList() {
      const game = App.currentGame;
      const byName = (a, b) => a.name.localeCompare(b.name);
      const entryFor = p => game.stagedChanges.find(c => c.playerId === p.id);

      const onField = game.players.filter(p => stagingEffectiveField(game, p)).sort(byName);
      // Longest off the field first (0 for anyone not actually benched yet,
      // e.g. staged out but still live on the field); ties broken alphabetically
      const bench = game.players.filter(p => !stagingEffectiveField(game, p)).sort((a, b) => {
        const diff = benchStintSortKey(b) - benchStintSortKey(a);
        return diff !== 0 ? diff : a.name.localeCompare(b.name);
      });
      const exact = onField.length === game.playersOnField;

      let html = `
        <div class="staging-section-header">
          <span class="staging-section-title">On Field</span>
          <span class="staging-section-count ${exact ? 'exact' : ''}">${onField.length}/${game.playersOnField}</span>
        </div>
      `;
      html += onField.length
        ? onField.map(p => renderStagingRow(p, entryFor(p))).join('')
        : '<div class="empty-row">No players on the field</div>';

      html += `
        <div class="staging-section-header">
          <span class="staging-section-title">Bench</span>
          <span class="staging-section-count">${bench.length}</span>
        </div>
      `;
      html += bench.length
        ? bench.map(p => renderStagingRow(p, entryFor(p))).join('')
        : '<div class="empty-row">No players on the bench</div>';

      document.getElementById('stagingList').innerHTML = html;

      document.getElementById('stagingModalButtons').innerHTML = `
        <button class="modal-btn confirm" id="stagingDoneBtn" ${exact ? '' : 'disabled'}>Done</button>
        <button class="modal-btn cancel" id="stagingCancelBtn">Cancel</button>
      `;
    }

    function openPositionMenu(playerId, context) {
      positionMenuPlayerId = playerId;
      positionMenuContext = context;
      openModal('positionMenuOverlay');
    }

    let pendingGoalTeam = null; // 'imm' | 'opponent' — which team the open Goal modal is for
    let selectedDetailsColor = null;

    function openGoalModal(team) {
      pendingGoalTeam = team;
      const game = App.currentGame;
      const teamName = team === 'imm' ? 'Immacolata' : (game.opponent || 'Opponent');
      const halfLabel = game.clock.currentHalf === 2 ? '2nd Half' : '1st Half';

      document.getElementById('goalModalTitle').textContent = `Goal — ${teamName}`;
      document.getElementById('goalModalMeta').textContent = `${halfLabel} · ${formatTime(App.getClockElapsedSeconds())}`;

      const select = document.getElementById('goalScorerSelect');
      const input = document.getElementById('goalScorerInput');

      if (team === 'imm') {
        const onField = game.players.filter(p => p.status === 'field').sort((a, b) => a.name.localeCompare(b.name));
        select.innerHTML = `<option value="">— Unknown scorer —</option>` +
          onField.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
        select.style.display = '';
        input.style.display = 'none';
      } else {
        input.value = '';
        input.style.display = '';
        select.style.display = 'none';
      }

      openModal('goalOverlay');
    }

    function renderDetailsColorGrid() {
      const grid = document.getElementById('detailsColorGrid');
      grid.innerHTML = App.OPPONENT_COLORS.map(color => `
        <button type="button" class="color-swatch ${color === selectedDetailsColor ? 'selected' : ''}" data-color="${color}" aria-label="${color}">
          <span class="color-swatch-dot" style="background:${color};"></span>
        </button>
      `).join('');
    }

    function renderDetailsRosterList() {
      const game = App.currentGame;
      const presentByName = new Map(game.players.map(p => [p.name, p]));

      document.getElementById('detailsRosterList').innerHTML = App.TEAM_ROSTER.map(p => {
        const present = presentByName.has(p.name);
        return `
          <label class="details-roster-row">
            <input type="checkbox" class="big-checkbox" data-name="${escapeHtml(p.name)}" ${present ? 'checked' : ''}>
            <span>${escapeHtml(p.name)}</span>
          </label>
        `;
      }).join('');
    }

    function openGameDetailsModal() {
      const game = App.currentGame;
      document.getElementById('detailsAbbr').value = game.opponentAbbr || '';
      document.getElementById('detailsOpponent').value = game.opponent || '';
      document.getElementById('detailsDateTime').value = game.dateTime || '';
      document.getElementById('detailsLocation').value = game.location || '';
      selectedDetailsColor = game.opponentColor || App.OPPONENT_COLORS[0];
      renderDetailsColorGrid();
      renderDetailsRosterList();
      openModal('gameDetailsOverlay');
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!App.currentGame) {
        location.href = 'index.html';
        return;
      }

      render();

      // Arriving from the Settings gear icon on the Summary page
      if (new URLSearchParams(window.location.search).get('openSettings') === '1') {
        openGameDetailsModal();
      }

      setInterval(() => {
        if (!App.currentGame) return;
        const gameId = App.currentGame.id;
        const outcome = App.checkAutoEndClock();
        if (outcome === 'ended') {
          location.href = `analytics.html?id=${gameId}`;
          return;
        }
        render();
      }, 500);

      // Long-press position badge -> menu, tap -> cycle
      const playerList = document.getElementById('playerList');
      let posPressTimer = null;
      let posLongPressed = false;

      playerList.addEventListener('pointerdown', e => {
        const badge = e.target.closest('.pos-badge');
        if (!badge) return;
        const player = App.currentGame.players.find(p => p.id === badge.dataset.playerId);
        if (!player || player.status !== 'field') return; // bench players have no position to change
        posLongPressed = false;
        posPressTimer = setTimeout(() => {
          posLongPressed = true;
          openPositionMenu(badge.dataset.playerId, 'main');
        }, 500);
      });
      playerList.addEventListener('pointerup', e => {
        const badge = e.target.closest('.pos-badge');
        clearTimeout(posPressTimer);
        if (badge && !posLongPressed) {
          App.cyclePosition(badge.dataset.playerId);
          render();
        }
      });
      playerList.addEventListener('pointerleave', () => clearTimeout(posPressTimer), true);
      playerList.addEventListener('pointercancel', () => clearTimeout(posPressTimer));
      playerList.addEventListener('contextmenu', e => {
        if (e.target.closest('.pos-badge')) e.preventDefault();
      });

      // Staging list: same long-press-badge / tap-badge / tap-action pattern as the main list
      const stagingList = document.getElementById('stagingList');
      let stagingPosPressTimer = null;
      let stagingPosLongPressed = false;

      stagingList.addEventListener('pointerdown', e => {
        const badge = e.target.closest('.pos-badge');
        if (!badge) return;
        if (!stagingEffectiveField(App.currentGame, App.currentGame.players.find(p => p.id === badge.dataset.playerId))) return;
        stagingPosLongPressed = false;
        stagingPosPressTimer = setTimeout(() => {
          stagingPosLongPressed = true;
          openPositionMenu(badge.dataset.playerId, 'staging');
        }, 500);
      });
      stagingList.addEventListener('pointerup', e => {
        const badge = e.target.closest('.pos-badge');
        clearTimeout(stagingPosPressTimer);
        if (badge && !stagingPosLongPressed) {
          const game = App.currentGame;
          const player = game.players.find(p => p.id === badge.dataset.playerId);
          if (!stagingEffectiveField(game, player)) return; // bench players have no position to change
          const entry = game.stagedChanges.find(c => c.playerId === player.id);
          const current = (entry && entry.action === 'in') ? entry.position : player.position;
          const idx = App.POSITIONS.indexOf(current);
          App.setStagedPosition(player.id, App.POSITIONS[(idx + 1) % App.POSITIONS.length]);
          renderStagingList();
        }
      });
      stagingList.addEventListener('pointerleave', () => clearTimeout(stagingPosPressTimer), true);
      stagingList.addEventListener('pointercancel', () => clearTimeout(stagingPosPressTimer));
      stagingList.addEventListener('contextmenu', e => {
        if (e.target.closest('.pos-badge')) e.preventDefault();
      });
      stagingList.addEventListener('click', e => {
        const btn = e.target.closest('.action-btn');
        if (!btn) return;
        App.stageToggle(btn.dataset.playerId);
        renderStagingList();
      });

      // Play / Sit
      playerList.addEventListener('click', e => {
        const btn = e.target.closest('.action-btn');
        if (!btn || btn.disabled) return;
        const id = btn.dataset.playerId;
        if (btn.dataset.action === 'sit') {
          App.substituteOut(id);
        } else {
          App.substituteIn(id);
        }
        render();
      });

      // Position menu modal — applies to whichever list opened it
      document.getElementById('positionMenuButtons').addEventListener('click', e => {
        const btn = e.target.closest('button[data-position]');
        if (!btn) return;

        if (positionMenuContext === 'staging') {
          App.setStagedPosition(positionMenuPlayerId, btn.dataset.position);
          closeModal('positionMenuOverlay');
          renderStagingList();
        } else {
          App.setPlayerPosition(positionMenuPlayerId, btn.dataset.position);
          closeModal('positionMenuOverlay');
          render();
        }
      });
      document.getElementById('positionMenuCancel').addEventListener('click', () => closeModal('positionMenuOverlay'));

      // Back / overflow menu — the hamburger goes to the Summary page;
      // Settings is reached from there via its gear icon.
      document.getElementById('backBtn').addEventListener('click', goHome);
      document.getElementById('overflowBtn').addEventListener('click', () => {
        location.href = `analytics.html?id=${App.currentGame.id}`;
      });

      // Banner center control: Play (pregame) / clock (in-progress, tap to
      // pause) / Resume + End (paused) — delegated since its content is
      // replaced on every renderBanner() call.
      document.getElementById('bannerCenter').addEventListener('click', e => {
        if (e.target.closest('#playBtn') || e.target.closest('#clockBigBtn') || e.target.closest('#resumeBtn')) {
          App.toggleClockPause();
          render();
          return;
        }
        if (e.target.closest('#endHalfBtn')) {
          const half = App.currentGame.clock.currentHalf;
          document.getElementById('endHalfConfirmTitle').textContent = half === 1 ? 'End the 1st half?' : 'End the game?';
          document.getElementById('confirmEndHalfBtn').textContent = half === 1 ? 'End Half' : 'End Game';
          openModal('endHalfConfirmOverlay');
        }
      });

      document.getElementById('confirmEndHalfBtn').addEventListener('click', () => {
        closeModal('endHalfConfirmOverlay');
        const result = App.endHalf();
        if (result === 'final') {
          const gameId = App.currentGame.id;
          App.endGame();
          location.href = `analytics.html?id=${gameId}`;
        } else {
          render();
        }
      });
      document.getElementById('cancelEndHalfBtn').addEventListener('click', () => closeModal('endHalfConfirmOverlay'));

      // Tap a team's score to record a goal
      document.getElementById('awayScore').addEventListener('click', () => {
        openGoalModal(App.currentGame.immSide === 'away' ? 'imm' : 'opponent');
      });
      document.getElementById('homeScore').addEventListener('click', () => {
        openGoalModal(App.currentGame.immSide === 'home' ? 'imm' : 'opponent');
      });

      // Footer: Stage (state A) / staged-count card with Cancel + Execute
      // (state B) — delegated since the footer's inner buttons are replaced
      // on every renderFooter() call.
      document.getElementById('footer').addEventListener('click', e => {
        if (e.target.closest('#stageBtn')) {
          // Opening Stage always starts a fresh session from current live
          // state — there's nothing to resume, since staging never lingers
          // once a session has already gone through Execute or Cancel.
          App.clearStaged();
          renderStagingList();
          openModal('stagingOverlay');
        } else if (e.target.closest('#cancelStagedBtn')) {
          App.clearStaged();
          render();
        } else if (e.target.closest('#executeStagedBtn')) {
          const result = App.executeStaged();
          if (result.ok) {
            render();
          } else if (result.reason === 'incorrect-count') {
            // shouldn't happen — Done is only reachable at the exact count —
            // but guard defensively in case state changed underneath us
            alert(`On field must be exactly ${App.currentGame.playersOnField} to finish — currently ${result.resultingCount}.`);
          }
        }
      });

      // Staging modal's buttons are recreated on every renderStagingList()
      // call — delegate on their (always-present) container instead of
      // binding directly. Done stays in place the whole time and just
      // toggles disabled/enabled (rather than appearing/disappearing) so the
      // button row doesn't shift under the user's thumb; it's only ever
      // clickable at the exact field count. Done just CLOSES the modal — it
      // does not apply anything. The actual Execute-or-Cancel decision
      // happens afterward, from the footer.
      document.getElementById('stagingModalButtons').addEventListener('click', e => {
        if (e.target.closest('#stagingCancelBtn')) {
          App.clearStaged();
          closeModal('stagingOverlay');
          render();
        } else {
          const doneBtn = e.target.closest('#stagingDoneBtn');
          if (!doneBtn || doneBtn.disabled) return;
          closeModal('stagingOverlay');
          render();
        }
      });

      // Click outside a modal's content box to dismiss it. For the staging
      // modal this behaves like Cancel — discard, don't hand off to the footer.
      const attachOutsideClickDismiss = (overlayId, onDismiss) => {
        document.getElementById(overlayId).addEventListener('click', e => {
          if (e.target.id === overlayId) onDismiss();
        });
      };
      attachOutsideClickDismiss('positionMenuOverlay', () => closeModal('positionMenuOverlay'));
      attachOutsideClickDismiss('goalOverlay', () => closeModal('goalOverlay'));
      attachOutsideClickDismiss('gameDetailsOverlay', () => closeModal('gameDetailsOverlay'));
      attachOutsideClickDismiss('endHalfConfirmOverlay', () => closeModal('endHalfConfirmOverlay'));
      attachOutsideClickDismiss('deleteGameConfirmOverlay', () => closeModal('deleteGameConfirmOverlay'));
      attachOutsideClickDismiss('stagingOverlay', () => {
        App.clearStaged();
        closeModal('stagingOverlay');
        render();
      });

      // Goal modal
      document.getElementById('confirmGoalBtn').addEventListener('click', () => {
        if (pendingGoalTeam === 'imm') {
          const playerId = document.getElementById('goalScorerSelect').value || null;
          App.recordGoal({ team: 'imm', playerId });
        } else {
          const playerName = document.getElementById('goalScorerInput').value.trim() || null;
          App.recordGoal({ team: 'opponent', playerName });
        }
        closeModal('goalOverlay');
        renderBanner();
      });
      document.getElementById('cancelGoalBtn').addEventListener('click', () => closeModal('goalOverlay'));

      // Game Details modal
      document.getElementById('detailsColorGrid').addEventListener('click', e => {
        const btn = e.target.closest('.color-swatch');
        if (!btn) return;
        selectedDetailsColor = btn.dataset.color;
        renderDetailsColorGrid();
      });
      document.getElementById('confirmGameDetailsBtn').addEventListener('click', () => {
        const opponent = document.getElementById('detailsOpponent').value.trim();
        const opponentAbbr = document.getElementById('detailsAbbr').value.trim().toUpperCase();

        if (!opponent) {
          alert('Opponent name is required');
          return;
        }
        if (opponentAbbr.length < 3 || opponentAbbr.length > 4) {
          alert('Abbreviation must be 3 or 4 letters');
          return;
        }

        const game = App.currentGame;
        game.opponent = opponent;
        game.opponentAbbr = opponentAbbr;
        game.opponentColor = selectedDetailsColor;
        game.dateTime = document.getElementById('detailsDateTime').value.trim();
        game.location = document.getElementById('detailsLocation').value.trim();

        const checkedNames = new Set([...document.querySelectorAll('#detailsRosterList input:checked')].map(cb => cb.dataset.name));
        const presentByName = new Map(game.players.map(p => [p.name, p]));
        const blockedRemovals = [];

        // Add newly-checked players
        checkedNames.forEach(name => {
          if (!presentByName.has(name)) App.addPlayer(name);
        });

        // Remove newly-unchecked players (only if they never actually played)
        game.players.slice().forEach(p => {
          if (!checkedNames.has(p.name)) {
            if (!App.removePlayer(p.id)) blockedRemovals.push(p.name);
          }
        });

        Storage.setCurrentGame(game);
        closeModal('gameDetailsOverlay');
        render();

        if (blockedRemovals.length) {
          alert(`Can't remove from roster (already have playing time): ${blockedRemovals.join(', ')}`);
        }
      });
      document.getElementById('cancelGameDetailsBtn').addEventListener('click', () => closeModal('gameDetailsOverlay'));

      // Delete game
      document.getElementById('deleteGameBtn').addEventListener('click', () => {
        closeModal('gameDetailsOverlay');
        openModal('deleteGameConfirmOverlay');
      });
      document.getElementById('cancelDeleteGameBtn').addEventListener('click', () => closeModal('deleteGameConfirmOverlay'));
      document.getElementById('confirmDeleteGameBtn').addEventListener('click', () => {
        Storage.clearCurrentGame();
        App.currentGame = null;
        location.href = 'index.html';
      });
    });
  </script>
</body>
</html>
