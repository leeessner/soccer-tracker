<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#007AFF">
  <title>Game Tracker - Soccer Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="../src/css/styles.css">
  <style>
    body {
      background: var(--background-light);
    }

    .tracker-root {
      width: 390px;
      height: 844px;
      background: var(--background-white);
      display: flex;
      flex-direction: column;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      margin: 0 auto;
    }

    .tracker-header {
      background: var(--background-white);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
    }

    .opponent-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
    }

    .opponent-info {
      flex: 1;
    }

    .opponent-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
    }

    .opponent-meta {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .time-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time-display {
      font-size: 28px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      min-width: 90px;
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .control-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--background-light);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      color: var(--primary-color);
      font-weight: 600;
      flex-shrink: 0;
    }

    .control-icon-btn:active {
      background: var(--border-color);
    }

    .list-header {
      height: 40px;
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      padding: 0 var(--spacing-lg);
      background: #f9f9f9;
      border-bottom: 1px solid var(--border-color);
    }

    .header-cell {
      font-size: var(--font-size-xs);
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .player-list {
      flex: 1;
      overflow-y: auto;
    }

    .footer {
      height: 60px;
      padding: 8px 16px;
      background: var(--background-white);
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border-color);
    }

    .stage-btn {
      flex: 1;
      height: 44px;
      border-radius: var(--radius-md);
      border: 1px solid var(--primary-color);
      background: white;
      color: var(--primary-color);
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
    }

    .stage-btn:active {
      background: var(--background-light);
    }
  </style>
</head>
<body>
  <div class="tracker-root">
    <div class="tracker-header">
      <div class="opponent-section">
        <button class="control-icon-btn" onclick="goHome()" style="background: none; margin: -8px;" title="Back to home">‹</button>
        <div class="opponent-info" id="opponentSection" style="cursor: pointer;">
          <h1 class="opponent-name" id="opponentName">SGA Alvarez</h1>
          <p class="opponent-meta" id="opponentMeta">Aug 30, 2:00 pm</p>
        </div>
        <div class="time-controls">
          <div class="time-display">12:34</div>
          <div class="controls">
            <button class="control-icon-btn" title="Pause/Resume">⏸</button>
            <button class="control-icon-btn" title="End Half" style="width: 36px; height: 36px; background: var(--primary-color); color: white;">⏹</button>
          </div>
        </div>
      </div>
    </div>

    <div class="list-header">
      <div class="header-cell" style="width: 36px;">Pos</div>
      <div class="header-cell" style="flex: 1;">Name</div>
      <div class="header-cell" style="width: 48px; text-align: right;">Total</div>
      <div class="header-cell" style="width: 48px; text-align: right;">Stint</div>
      <div class="header-cell" style="width: 56px; text-align: center;">Action</div>
    </div>

    <div class="player-list" id="playerList">
      <!-- Players will be rendered here -->
    </div>

    <div class="footer">
      <button class="stage-btn">Stage</button>
    </div>
  </div>

  <script src="../src/js/storage.js"></script>
  <script src="../src/js/app.js"></script>
  <script>
    function goHome() {
      if (confirm('Leave game? Any unsaved changes will be lost.')) {
        location.href = 'index.html';
      }
    }

    // TODO: Render player list from current game state
    document.addEventListener('DOMContentLoaded', () => {
      console.log('Game Tracker loaded');
      const currentGame = Storage.getCurrentGame();
      console.log('Current game:', currentGame);
    });
  </script>
</body>
</html>
