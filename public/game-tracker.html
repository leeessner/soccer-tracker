<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#007AFF">
  <title>Game Tracker - Soccer Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="../src/css/styles.css">
  <style>
    body {
      background: var(--background-light);
    }

    .tracker-root {
      width: 390px;
      height: 844px;
      background: var(--background-white);
      display: flex;
      flex-direction: column;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      margin: 0 auto;
    }

    .tracker-header {
      background: var(--background-white);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
    }

    .opponent-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    .opponent-info {
      flex: 1;
      min-width: 0;
    }

    .opponent-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .opponent-meta {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .time-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time-display {
      font-size: 28px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      min-width: 90px;
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .control-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--background-light);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      color: var(--primary-color);
      font-weight: 600;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    .control-icon-btn:active {
      background: var(--border-color);
    }

    .list-header {
      height: 40px;
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      padding: 0 var(--spacing-lg);
      background: #f9f9f9;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .header-cell {
      font-size: var(--font-size-xs);
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .player-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .section-label {
      padding: 6px 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      background: #f9f9f9;
      text-transform: uppercase;
      position: sticky;
      top: 0;
    }

    .empty-row {
      padding: 16px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .pos-badge {
      width: 36px;
      height: 28px;
      border-radius: 14px;
      border: none;
      font-size: 11px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      flex-shrink: 0;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .pos-badge.pos-forward { background: #FF9500; }
    .pos-badge.pos-midfield { background: #34C759; }
    .pos-badge.pos-defense { background: #007AFF; }
    .pos-badge.pos-goalie { background: #AF52DE; }
    .pos-badge.pos-none { background: #8e8e93; }

    .pos-badge-inert {
      cursor: default;
    }

    .player-name-cell {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 15px;
    }

    .time-cell {
      width: 48px;
      text-align: right;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .time-cell.dim {
      color: var(--text-secondary);
    }

    .action-cell {
      width: 56px;
      text-align: center;
      flex-shrink: 0;
    }

    .action-btn {
      height: 32px;
      min-width: 48px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }

    .action-btn.play {
      background: var(--primary-color);
      color: white;
    }

    .action-btn.sit {
      background: #FFEBEA;
      color: #FF3B30;
    }

    .action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .footer {
      height: 60px;
      padding: 8px 16px;
      background: var(--background-white);
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .footer-btn {
      flex: 1;
      height: 44px;
      border-radius: var(--radius-md);
      border: 1px solid var(--primary-color);
      background: white;
      color: var(--primary-color);
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
    }

    .footer-btn:active {
      background: var(--background-light);
    }

    .staged-card {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .staged-label {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .footer-btn-secondary {
      flex: 0 0 auto;
      padding: 0 16px;
      background: var(--background-light);
      color: var(--primary-color);
      border-color: transparent;
    }

    .footer-btn-secondary:active {
      background: var(--border-color);
    }

    .modal input[type="text"] {
      margin-bottom: 12px;
    }

    .position-choice-btn {
      background: var(--background-light);
      color: var(--text-primary);
    }

    .position-choice-btn:active {
      background: var(--border-color);
    }

    .modal-staging {
      max-width: 374px;
      width: calc(100% - 16px);
    }

    .staging-list {
      max-height: 68vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      margin-bottom: 16px;
    }

    .staging-section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 6px 12px;
      background: #f9f9f9;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
    }

    .staging-section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .staging-section-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .staging-section-count.exact {
      color: #34C759;
    }

    .staging-row {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      padding: 8px var(--spacing-md);
      border-bottom: 1px solid var(--border-light);
    }

    .staging-row:last-child {
      border-bottom: none;
    }

    .staging-row.staged {
      background: #EAF2FF;
    }

    .staging-name {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 14px;
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div class="tracker-root">
    <div class="tracker-header">
      <div class="opponent-section">
        <button class="control-icon-btn" onclick="goHome()" style="background: none; margin: -8px;" title="Back to home">‹</button>
        <div class="opponent-info" id="opponentSection" style="cursor: pointer;" title="Long-press to edit">
          <h1 class="opponent-name" id="opponentName">Opponent</h1>
          <p class="opponent-meta" id="opponentMeta">&nbsp;</p>
        </div>
        <div class="time-controls">
          <div class="time-display" id="timeDisplay">0:00</div>
          <div class="controls">
            <button class="control-icon-btn" id="pauseBtn" title="Pause/Resume">▶</button>
            <button class="control-icon-btn" id="endHalfBtn" title="End Half" style="background: var(--primary-color); color: white;">⏹</button>
          </div>
        </div>
      </div>
    </div>

    <div class="list-header">
      <div class="header-cell" style="width: 36px;">Pos</div>
      <div class="header-cell" style="flex: 1;">Name</div>
      <div class="header-cell" style="width: 48px; text-align: right;">Total</div>
      <div class="header-cell" style="width: 48px; text-align: right;">Stint</div>
      <div class="header-cell" style="width: 56px; text-align: center;">Action</div>
    </div>

    <div class="player-list" id="playerList">
      <!-- Players will be rendered here -->
    </div>

    <div class="footer" id="footer">
      <button class="footer-btn" id="stageBtn">Stage</button>
    </div>
  </div>

  <!-- Position picker (long-press on a position badge, main list or staging list) -->
  <div class="modal-overlay hidden" id="positionMenuOverlay">
    <div class="modal">
      <h3 class="modal-title">Change Position</h3>
      <div class="modal-buttons" id="positionMenuButtons">
        <button class="modal-btn position-choice-btn" data-position="Forward">Forward</button>
        <button class="modal-btn position-choice-btn" data-position="Midfield">Midfield</button>
        <button class="modal-btn position-choice-btn" data-position="Defense">Defense</button>
        <button class="modal-btn position-choice-btn" data-position="Goalie">Goalie</button>
        <button class="modal-btn position-choice-btn" data-position="None">—</button>
        <button class="modal-btn cancel" id="positionMenuCancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Staging (bulk substitution) -->
  <div class="modal-overlay hidden" id="stagingOverlay">
    <div class="modal modal-staging">
      <h3 class="modal-title">Stage Substitutions</h3>
      <div class="staging-list" id="stagingList"><!-- sections + rows rendered here --></div>
      <div class="modal-buttons" id="stagingModalButtons"><!-- Cancel always here; Done only appears at the exact field count --></div>
    </div>
  </div>

  <!-- Edit game (long-press opponent) -->
  <div class="modal-overlay hidden" id="editGameOverlay">
    <div class="modal">
      <h3 class="modal-title">Edit Game</h3>
      <input type="text" id="editOpponent" placeholder="Opponent">
      <input type="text" id="editDateTime" placeholder="Date & time">
      <input type="text" id="editLocation" placeholder="Location">
      <div class="modal-buttons">
        <button class="modal-btn confirm" id="confirmEditGameBtn">Save</button>
        <button class="modal-btn cancel" id="cancelEditGameBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="../src/js/storage.js"></script>
  <script src="../src/js/app.js"></script>
  <script>
    const POS_ABBR = { Forward: 'FWD', Midfield: 'MID', Defense: 'DEF', Goalie: 'GK', None: '—' };
    const POS_CLASS = { Forward: 'pos-forward', Midfield: 'pos-midfield', Defense: 'pos-defense', Goalie: 'pos-goalie', None: 'pos-none' };

    let positionMenuPlayerId = null;
    let positionMenuContext = 'main'; // 'main' or 'staging' — which list opened the picker

    function goHome() {
      if (confirm('Leave game? Any unsaved changes will be lost.')) {
        location.href = 'index.html';
      }
    }

    function formatTime(totalSeconds) {
      const s = Math.max(0, Math.floor(totalSeconds));
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${m}:${String(sec).padStart(2, '0')}`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function openModal(id) {
      document.getElementById(id).classList.remove('hidden');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function attachLongPress(el, { onLongPress, onClick, duration = 500 }) {
      let timer = null;
      let longPressed = false;

      el.addEventListener('pointerdown', () => {
        longPressed = false;
        timer = setTimeout(() => {
          longPressed = true;
          onLongPress();
        }, duration);
      });
      el.addEventListener('pointerup', () => {
        clearTimeout(timer);
        if (!longPressed && onClick) onClick();
      });
      el.addEventListener('pointerleave', () => clearTimeout(timer));
      el.addEventListener('pointercancel', () => clearTimeout(timer));
      el.addEventListener('contextmenu', e => e.preventDefault());
    }

    function updateHeader() {
      const game = App.currentGame;
      const halfLabel = game.clock.currentHalf === 2 ? '2nd Half' : '1st Half';
      document.getElementById('opponentName').textContent = game.opponent || 'Opponent';
      document.getElementById('opponentMeta').textContent = [game.dateTime, game.location, halfLabel].filter(Boolean).join(' · ');
      document.getElementById('timeDisplay').textContent = formatTime(App.getClockElapsedSeconds());

      const pauseBtn = document.getElementById('pauseBtn');
      pauseBtn.textContent = game.clock.isPaused ? '▶' : '⏸';
      pauseBtn.title = game.clock.isPaused ? 'Resume' : 'Pause';

      const endHalfBtn = document.getElementById('endHalfBtn');
      endHalfBtn.title = game.clock.currentHalf === 1 ? 'End 1st Half' : 'End Game';
    }

    function renderPlayerRow(player, elapsedNow, fieldFull) {
      const isField = player.status === 'field';
      const stintSeconds = isField ? elapsedNow - player.stintStartSeconds : App.getBenchStintSeconds(player);
      const totalSeconds = (player.totalSeconds || 0) + (isField ? stintSeconds : 0);

      return `
        <div class="player-row ${isField ? 'playing' : 'bench'}">
          <button class="pos-badge ${POS_CLASS[player.position]} ${isField ? '' : 'pos-badge-inert'}" data-player-id="${player.id}">${POS_ABBR[player.position]}</button>
          <div class="player-name-cell">${escapeHtml(player.name)}</div>
          <div class="time-cell">${formatTime(totalSeconds)}</div>
          <div class="time-cell dim">${formatTime(stintSeconds)}</div>
          <div class="action-cell">
            <button
              class="action-btn ${isField ? 'sit' : 'play'}"
              data-player-id="${player.id}"
              data-action="${isField ? 'sit' : 'play'}"
              ${!isField && fieldFull ? 'disabled title="Bench a player first"' : ''}
            >${isField ? 'Sit' : 'Play'}</button>
          </div>
        </div>
      `;
    }

    function benchStintSortKey(player) {
      return Math.floor(App.getBenchStintSeconds(player));
    }

    function renderRoster() {
      const game = App.currentGame;
      const elapsedNow = App.getClockElapsedSeconds();
      const byName = (a, b) => a.name.localeCompare(b.name);

      const field = game.players.filter(p => p.status === 'field').sort(byName);
      // Longest off the field first; ties broken alphabetically
      const bench = game.players.filter(p => p.status === 'bench').sort((a, b) => {
        const diff = benchStintSortKey(b) - benchStintSortKey(a);
        return diff !== 0 ? diff : a.name.localeCompare(b.name);
      });
      const fieldFull = field.length >= game.playersOnField;

      let html = `<div class="section-label">On Field (${field.length}/${game.playersOnField})</div>`;
      html += field.length
        ? field.map(p => renderPlayerRow(p, elapsedNow, fieldFull)).join('')
        : '<div class="empty-row">No players on the field</div>';

      html += `<div class="section-label">Bench (${bench.length})</div>`;
      html += bench.length
        ? bench.map(p => renderPlayerRow(p, elapsedNow, fieldFull)).join('')
        : '<div class="empty-row">No players on the bench</div>';

      document.getElementById('playerList').innerHTML = html;
    }

    function renderFooter() {
      const footer = document.getElementById('footer');
      const staged = App.currentGame.stagedChanges;

      if (staged.length === 0) {
        footer.innerHTML = `<button class="footer-btn" id="stageBtn">Stage</button>`;
      } else {
        footer.innerHTML = `
          <div class="staged-card">
            <span class="staged-label">${staged.length} player${staged.length === 1 ? '' : 's'} staged</span>
            <button class="footer-btn footer-btn-secondary" id="cancelStagedBtn">Cancel</button>
            <button class="footer-btn" id="executeStagedBtn">Execute</button>
          </div>
        `;
      }
    }

    function render() {
      updateHeader();
      renderRoster();
      renderFooter();
    }

    function renderStagingRow(player, entry) {
      const effectiveField = entry ? entry.action === 'in' : player.status === 'field';
      // Bench players (effectively) don't have a position, regardless of what's staged
      const effectivePosition = effectiveField
        ? ((entry && entry.action === 'in') ? entry.position : player.position)
        : 'None';

      return `
        <div class="staging-row ${entry ? 'staged' : ''}">
          <button class="pos-badge ${POS_CLASS[effectivePosition]} ${effectiveField ? '' : 'pos-badge-inert'}" data-player-id="${player.id}">${POS_ABBR[effectivePosition]}</button>
          <div class="staging-name">${escapeHtml(player.name)}</div>
          <button class="action-btn ${effectiveField ? 'sit' : 'play'}" data-player-id="${player.id}">${effectiveField ? 'Sit' : 'Play'}</button>
        </div>
      `;
    }

    function stagingEffectiveField(game, player) {
      const entry = game.stagedChanges.find(c => c.playerId === player.id);
      return entry ? entry.action === 'in' : player.status === 'field';
    }

    function renderStagingList() {
      const game = App.currentGame;
      const byName = (a, b) => a.name.localeCompare(b.name);
      const entryFor = p => game.stagedChanges.find(c => c.playerId === p.id);

      const onField = game.players.filter(p => stagingEffectiveField(game, p)).sort(byName);
      // Longest off the field first (0 for anyone not actually benched yet,
      // e.g. staged out but still live on the field); ties broken alphabetically
      const bench = game.players.filter(p => !stagingEffectiveField(game, p)).sort((a, b) => {
        const diff = benchStintSortKey(b) - benchStintSortKey(a);
        return diff !== 0 ? diff : a.name.localeCompare(b.name);
      });
      const exact = onField.length === game.playersOnField;

      let html = `
        <div class="staging-section-header">
          <span class="staging-section-title">On Field</span>
          <span class="staging-section-count ${exact ? 'exact' : ''}">${onField.length}/${game.playersOnField}</span>
        </div>
      `;
      html += onField.length
        ? onField.map(p => renderStagingRow(p, entryFor(p))).join('')
        : '<div class="empty-row">No players on the field</div>';

      html += `
        <div class="staging-section-header">
          <span class="staging-section-title">Bench</span>
          <span class="staging-section-count">${bench.length}</span>
        </div>
      `;
      html += bench.length
        ? bench.map(p => renderStagingRow(p, entryFor(p))).join('')
        : '<div class="empty-row">No players on the bench</div>';

      document.getElementById('stagingList').innerHTML = html;

      document.getElementById('stagingModalButtons').innerHTML = `
        <button class="modal-btn confirm" id="stagingDoneBtn" ${exact ? '' : 'disabled'}>Done</button>
        <button class="modal-btn cancel" id="stagingCancelBtn">Cancel</button>
      `;
    }

    function openPositionMenu(playerId, context) {
      positionMenuPlayerId = playerId;
      positionMenuContext = context;
      openModal('positionMenuOverlay');
    }

    function openEditGameModal() {
      document.getElementById('editOpponent').value = App.currentGame.opponent || '';
      document.getElementById('editDateTime').value = App.currentGame.dateTime || '';
      document.getElementById('editLocation').value = App.currentGame.location || '';
      openModal('editGameOverlay');
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!App.currentGame) {
        location.href = 'index.html';
        return;
      }

      render();
      setInterval(render, 500);

      // Long-press position badge -> menu, tap -> cycle
      const playerList = document.getElementById('playerList');
      let posPressTimer = null;
      let posLongPressed = false;

      playerList.addEventListener('pointerdown', e => {
        const badge = e.target.closest('.pos-badge');
        if (!badge) return;
        const player = App.currentGame.players.find(p => p.id === badge.dataset.playerId);
        if (!player || player.status !== 'field') return; // bench players have no position to change
        posLongPressed = false;
        posPressTimer = setTimeout(() => {
          posLongPressed = true;
          openPositionMenu(badge.dataset.playerId, 'main');
        }, 500);
      });
      playerList.addEventListener('pointerup', e => {
        const badge = e.target.closest('.pos-badge');
        clearTimeout(posPressTimer);
        if (badge && !posLongPressed) {
          App.cyclePosition(badge.dataset.playerId);
          render();
        }
      });
      playerList.addEventListener('pointerleave', () => clearTimeout(posPressTimer), true);
      playerList.addEventListener('pointercancel', () => clearTimeout(posPressTimer));
      playerList.addEventListener('contextmenu', e => {
        if (e.target.closest('.pos-badge')) e.preventDefault();
      });

      // Staging list: same long-press-badge / tap-badge / tap-action pattern as the main list
      const stagingList = document.getElementById('stagingList');
      let stagingPosPressTimer = null;
      let stagingPosLongPressed = false;

      stagingList.addEventListener('pointerdown', e => {
        const badge = e.target.closest('.pos-badge');
        if (!badge) return;
        if (!stagingEffectiveField(App.currentGame, App.currentGame.players.find(p => p.id === badge.dataset.playerId))) return;
        stagingPosLongPressed = false;
        stagingPosPressTimer = setTimeout(() => {
          stagingPosLongPressed = true;
          openPositionMenu(badge.dataset.playerId, 'staging');
        }, 500);
      });
      stagingList.addEventListener('pointerup', e => {
        const badge = e.target.closest('.pos-badge');
        clearTimeout(stagingPosPressTimer);
        if (badge && !stagingPosLongPressed) {
          const game = App.currentGame;
          const player = game.players.find(p => p.id === badge.dataset.playerId);
          if (!stagingEffectiveField(game, player)) return; // bench players have no position to change
          const entry = game.stagedChanges.find(c => c.playerId === player.id);
          const current = (entry && entry.action === 'in') ? entry.position : player.position;
          const idx = App.POSITIONS.indexOf(current);
          App.setStagedPosition(player.id, App.POSITIONS[(idx + 1) % App.POSITIONS.length]);
          renderStagingList();
        }
      });
      stagingList.addEventListener('pointerleave', () => clearTimeout(stagingPosPressTimer), true);
      stagingList.addEventListener('pointercancel', () => clearTimeout(stagingPosPressTimer));
      stagingList.addEventListener('contextmenu', e => {
        if (e.target.closest('.pos-badge')) e.preventDefault();
      });
      stagingList.addEventListener('click', e => {
        const btn = e.target.closest('.action-btn');
        if (!btn) return;
        App.stageToggle(btn.dataset.playerId);
        renderStagingList();
      });

      // Play / Sit
      playerList.addEventListener('click', e => {
        const btn = e.target.closest('.action-btn');
        if (!btn || btn.disabled) return;
        const id = btn.dataset.playerId;
        if (btn.dataset.action === 'sit') {
          App.substituteOut(id);
        } else {
          App.substituteIn(id);
        }
        render();
      });

      // Position menu modal — applies to whichever list opened it
      document.getElementById('positionMenuButtons').addEventListener('click', e => {
        const btn = e.target.closest('button[data-position]');
        if (!btn) return;

        if (positionMenuContext === 'staging') {
          App.setStagedPosition(positionMenuPlayerId, btn.dataset.position);
          closeModal('positionMenuOverlay');
          renderStagingList();
        } else {
          App.setPlayerPosition(positionMenuPlayerId, btn.dataset.position);
          closeModal('positionMenuOverlay');
          render();
        }
      });
      document.getElementById('positionMenuCancel').addEventListener('click', () => closeModal('positionMenuOverlay'));

      // Pause / resume
      document.getElementById('pauseBtn').addEventListener('click', () => {
        App.toggleClockPause();
        render();
      });

      // End half / end game
      document.getElementById('endHalfBtn').addEventListener('click', () => {
        const half = App.currentGame.clock.currentHalf;
        const confirmed = confirm(half === 1 ? 'End the 1st half?' : 'End the game?');
        if (!confirmed) return;

        const result = App.endHalf();
        if (result === 'final') {
          const gameId = App.currentGame.id;
          App.endGame();
          location.href = `analytics.html?id=${gameId}`;
        } else {
          render();
        }
      });

      // Footer: Stage (state A) / staged-count card with Cancel + Execute
      // (state B) — delegated since the footer's inner buttons are replaced
      // on every renderFooter() call.
      document.getElementById('footer').addEventListener('click', e => {
        if (e.target.closest('#stageBtn')) {
          // Opening Stage always starts a fresh session from current live
          // state — there's nothing to resume, since staging never lingers
          // once a session has already gone through Execute or Cancel.
          App.clearStaged();
          renderStagingList();
          openModal('stagingOverlay');
        } else if (e.target.closest('#cancelStagedBtn')) {
          App.clearStaged();
          render();
        } else if (e.target.closest('#executeStagedBtn')) {
          const result = App.executeStaged();
          if (result.ok) {
            render();
          } else if (result.reason === 'incorrect-count') {
            // shouldn't happen — Done is only reachable at the exact count —
            // but guard defensively in case state changed underneath us
            alert(`On field must be exactly ${App.currentGame.playersOnField} to finish — currently ${result.resultingCount}.`);
          }
        }
      });

      // Staging modal's buttons are recreated on every renderStagingList()
      // call — delegate on their (always-present) container instead of
      // binding directly. Done stays in place the whole time and just
      // toggles disabled/enabled (rather than appearing/disappearing) so the
      // button row doesn't shift under the user's thumb; it's only ever
      // clickable at the exact field count. Done just CLOSES the modal — it
      // does not apply anything. The actual Execute-or-Cancel decision
      // happens afterward, from the footer.
      document.getElementById('stagingModalButtons').addEventListener('click', e => {
        if (e.target.closest('#stagingCancelBtn')) {
          App.clearStaged();
          closeModal('stagingOverlay');
          render();
        } else {
          const doneBtn = e.target.closest('#stagingDoneBtn');
          if (!doneBtn || doneBtn.disabled) return;
          closeModal('stagingOverlay');
          render();
        }
      });

      // Click outside a modal's content box to dismiss it. For the staging
      // modal this behaves like Cancel — discard, don't hand off to the footer.
      const attachOutsideClickDismiss = (overlayId, onDismiss) => {
        document.getElementById(overlayId).addEventListener('click', e => {
          if (e.target.id === overlayId) onDismiss();
        });
      };
      attachOutsideClickDismiss('positionMenuOverlay', () => closeModal('positionMenuOverlay'));
      attachOutsideClickDismiss('editGameOverlay', () => closeModal('editGameOverlay'));
      attachOutsideClickDismiss('stagingOverlay', () => {
        App.clearStaged();
        closeModal('stagingOverlay');
        render();
      });

      // Edit game (opponent long-press)
      attachLongPress(document.getElementById('opponentSection'), {
        onLongPress: openEditGameModal
      });
      document.getElementById('confirmEditGameBtn').addEventListener('click', () => {
        const opponent = document.getElementById('editOpponent').value.trim();
        if (!opponent) {
          alert('Opponent name is required');
          return;
        }
        App.currentGame.opponent = opponent;
        App.currentGame.dateTime = document.getElementById('editDateTime').value.trim();
        App.currentGame.location = document.getElementById('editLocation').value.trim();
        Storage.setCurrentGame(App.currentGame);
        closeModal('editGameOverlay');
        render();
      });
      document.getElementById('cancelEditGameBtn').addEventListener('click', () => closeModal('editGameOverlay'));
    });
  </script>
</body>
</html>
