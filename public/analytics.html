<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#007AFF">
  <title>Game Analytics - Soccer Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="../src/css/styles.css">
  <style>
    body {
      background: var(--background-light);
    }

    .analytics-root {
      width: 390px;
      min-height: 844px;
      background: var(--background-white);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      margin: 0 auto;
    }

    .analytics-header {
      background: var(--background-white);
      border-bottom: 1px solid var(--border-color);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .analytics-back {
      width: 36px;
      height: 36px;
      border: none;
      background: none;
      color: var(--primary-color);
      font-size: 24px;
      cursor: pointer;
    }

    .analytics-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0;
      flex: 1;
    }

    .analytics-content {
      padding: 24px 16px;
    }

    .game-info {
      margin-bottom: 24px;
    }

    .game-opponent {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 8px 0;
    }

    .game-meta {
      font-size: 14px;
      color: var(--text-secondary);
      margin: 0;
    }

    .stats-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 24px;
    }

    .stats-table th {
      background: #f9f9f9;
      padding: 12px 8px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
    }

    .stats-table td {
      padding: 12px 8px;
      border-bottom: 1px solid var(--border-light);
      font-size: 15px;
    }

    .player-name {
      font-weight: 500;
      color: var(--text-primary);
    }

    .analytics-chart {
      background: #f9f9f9;
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 24px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-home, .btn-export {
      flex: 1;
      height: 44px;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-home {
      background: var(--background-light);
      color: var(--primary-color);
    }

    .btn-export {
      background: var(--primary-color);
      color: white;
    }

    .btn-export:active {
      background: var(--primary-dark);
    }
  </style>
</head>
<body>
  <div class="analytics-root">
    <div class="analytics-header">
      <button class="analytics-back" onclick="location.href='index.html'">‹</button>
      <h1 class="analytics-title">Game Summary</h1>
    </div>

    <div class="analytics-content">
      <div class="game-info">
        <h2 class="game-opponent" id="gameOpponent">SGA Alvarez</h2>
        <p class="game-meta" id="gameDate">August 30, 2024</p>
      </div>

      <div class="analytics-chart">
        📊 Chart placeholder - playing time distribution will display here
      </div>

      <table class="stats-table">
        <thead>
          <tr>
            <th>Player</th>
            <th>Total</th>
            <th>H1</th>
            <th>H2</th>
          </tr>
        </thead>
        <tbody id="statsBody">
          <tr>
            <td colspan="4" style="text-align: center; padding: 24px; color: var(--text-secondary);">No game data available</td>
          </tr>
        </tbody>
      </table>

      <div class="actions">
        <button class="btn-home" onclick="location.href='index.html'">Home</button>
        <button class="btn-export">Export</button>
      </div>
    </div>
  </div>

  <script src="../src/js/storage.js"></script>
  <script src="../src/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Get game ID from URL params
      const params = new URLSearchParams(window.location.search);
      const gameId = params.get('id');

      if (gameId) {
        const game = Storage.getGame(gameId);
        if (game) {
          document.getElementById('gameOpponent').textContent = game.opponent;
          document.getElementById('gameDate').textContent = new Date(game.savedAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
          // TODO: Populate stats table from game data
        }
      }
    });
  </script>
</body>
</html>
