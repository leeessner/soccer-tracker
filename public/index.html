<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#007AFF">
  <meta name="description" content="Track youth soccer player playing time during games">
  <title>Soccer Playing Time Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23007AFF' width='180' height='180'/><text x='50%' y='50%' font-size='80' font-weight='bold' text-anchor='middle' dominant-baseline='central' fill='white'>⚽</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23007AFF' width='180' height='180'/><text x='50%' y='50%' font-size='80' font-weight='bold' text-anchor='middle' dominant-baseline='central' fill='white'>⚽</text></svg>">
  <link rel="stylesheet" href="../src/css/styles.css">
  <style>
    body {
      background: var(--background-light);
    }

    .home-root {
      width: 390px;
      height: 844px;
      background: var(--background-white);
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      margin: 0 auto;
    }

    .home-header {
      background: var(--background-white);
      border-bottom: 1px solid var(--border-color);
      padding: 24px 16px;
    }

    .home-title {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
      text-align: center;
    }

    .home-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      overflow-y: auto;
    }

    .game-card {
      background: var(--background-white);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .game-card:active {
      background: var(--background-light);
    }

    .game-card-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .game-card-opponent {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0;
    }

    .game-card-date {
      font-size: var(--font-size-small);
      color: var(--text-secondary);
    }

    .game-card-stats {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: var(--font-size-small);
      color: var(--text-secondary);
    }

    .game-card.live {
      border-color: var(--primary-color);
      background: #EAF2FF;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      color: var(--primary-color);
      background: white;
      border: 1px solid var(--primary-color);
      border-radius: 999px;
      padding: 3px 9px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary-color);
    }

    .start-game-helper {
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
      margin: 8px 0 0;
    }

    .empty-state {
      text-align: center;
      color: var(--text-secondary);
      padding: 40px 16px;
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    .empty-state-text {
      font-size: 17px;
      margin: 0;
    }

    .home-footer {
      padding: 16px;
      border-top: 1px solid var(--border-color);
    }

    .btn-start-game {
      width: 100%;
      height: 50px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-start-game:active {
      background: var(--primary-dark);
    }
  </style>
</head>
<body>
  <div class="home-root">
    <div class="home-header">
      <h1 class="home-title">⚽</h1>
    </div>

    <div class="home-content">
      <div id="gamesList">
        <div class="empty-state">
          <div class="empty-state-icon">📋</div>
          <p class="empty-state-text">No games yet</p>
          <p style="font-size: 13px; margin: 0; color: var(--text-secondary);">Start tracking your team's playing time</p>
        </div>
      </div>
    </div>

    <div class="home-footer">
      <button class="btn-start-game" id="startGameBtn" onclick="location.href='game-setup.html'">Start New Game</button>
      <p class="start-game-helper" id="startGameHelper" style="display:none;">Finish the game in progress before starting a new one.</p>
    </div>
  </div>

  <script src="../src/js/storage.js"></script>
  <script src="../src/js/app.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function elapsedFor(game) {
      const c = game.clock;
      const running = (!c.isPaused && c.runStartedAt) ? (Date.now() - c.runStartedAt) / 1000 : 0;
      return (c.accumulatedSeconds || 0) + running;
    }

    function renderGameCard(game, isLive) {
      const dateLabel = game.dateTime || (game.savedAt ? new Date(game.savedAt).toLocaleDateString() : '');
      const minutes = Math.floor((isLive ? elapsedFor(game) : (game.clock?.totalSeconds || 0)) / 60);

      return `
        <div class="game-card ${isLive ? 'live' : ''}" data-game-id="${game.id}" data-live="${isLive}">
          <div class="game-card-header">
            <h3 class="game-card-opponent">${escapeHtml(game.opponent || 'Opponent')}</h3>
            ${isLive ? '<span class="live-badge"><span class="live-dot"></span>In Progress</span>' : `<span class="game-card-date">${escapeHtml(dateLabel)}</span>`}
          </div>
          <div class="game-card-stats">
            <span>${game.players?.length || 0} players</span>
            <span>${minutes} min</span>
            ${isLive && dateLabel ? `<span class="game-card-date">${escapeHtml(dateLabel)}</span>` : ''}
          </div>
        </div>
      `;
    }

    // Load and display saved games, plus the in-progress game (if any) pinned to the top
    function loadGames() {
      const games = Storage.getAllGames().slice().sort((a, b) => new Date(b.savedAt || 0) - new Date(a.savedAt || 0));
      const currentGame = Storage.getCurrentGame();
      if (currentGame) App.ensureGameDefaults(currentGame);

      const startBtn = document.getElementById('startGameBtn');
      const startHelper = document.getElementById('startGameHelper');
      startBtn.disabled = !!currentGame;
      startHelper.style.display = currentGame ? '' : 'none';

      const gamesList = document.getElementById('gamesList');
      const cards = (currentGame ? [renderGameCard(currentGame, true)] : []).concat(games.map(g => renderGameCard(g, false)));

      gamesList.innerHTML = cards.length ? cards.join('') : `
        <div class="empty-state">
          <div class="empty-state-icon">📋</div>
          <p class="empty-state-text">No games yet</p>
          <p style="font-size: 13px; margin: 0; color: var(--text-secondary);">Start tracking your team's playing time</p>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadGames();

      document.getElementById('gamesList').addEventListener('click', e => {
        const card = e.target.closest('.game-card');
        if (!card) return;
        location.href = card.dataset.live === 'true' ? 'game-tracker.html' : `analytics.html?id=${card.dataset.gameId}`;
      });
    });
  </script>
</body>
</html>
